<!doctype html>

    :root {

      --text: #1d2420;
      --muted: #5f6b64;
      --accent: #2f6b4f;
      --accent-text: #ffffff;
      --border: #e3e1d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121614;
        --card: #1a201d;
        --text: #eef2ef;
        --muted: #9aa8a0;
        --accent: #5fae86;
        --accent-text: #0f1311;
        --border: #2a322e;
      }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 32px;
      text-align: center;
    }
    .label {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1.15;
      word-break: break-word;
    }
    p {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 17px;
    }
    a.button {
      display: inline-block;
      background: var(--accent);
      color: var(--accent-text);
      text-decoration: none;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 10px;
    }
    a.button:hover { opacity: 0.9; }
    .email {
      margin-top: 16px;
      font-size: 15px;
      color: var(--muted);
    }
    .email a { color: inherit; }
  </style>
</head>
<body>
  <main>

    <a class="button" href="mailto:spindlesupply@gmail.com?subject=Interest%20in%20wemakecbd.com">Make an offer</a>
